<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Order Status — HARIOM LED & HD FLEX</title>
  <meta name="description" content="Track your order status at HARIOM LED & HD FLEX, Gangapur - Bhilwara" />
  <style>
    :root {
      --green:  #25d366;
      --dark:   #0a0a0f;
      --card:   #111118;
      --border: rgba(255,255,255,0.08);
      --text:   #e5e7eb;
      --muted:  #6b7280;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 20px 20px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -40px; left: 50%; transform: translateX(-50%);
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
    }
    .logo-ring {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px; font-size: 24px;
      box-shadow: 0 8px 24px rgba(59,130,246,0.3);
    }
    .company-name { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.3px; }
    .company-sub  { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* ── Container ── */
    .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

    /* ── Loading / Error ── */
    .state-box {
      text-align: center; padding: 60px 20px;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Order card ── */
    .order-card {
      background: var(--card); border-radius: 18px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .order-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    .order-no {
      font-size: 22px; font-weight: 800; color: #fff;
      font-family: 'Courier New', monospace;
    }
    .order-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .badge {
      font-size: 10px; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge-dept  { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .badge-paid  { background: rgba(37,211,102,0.15); color: #86efac; border: 1px solid rgba(37,211,102,0.3); }
    .badge-pending { background: rgba(251,191,36,0.15); color: #fcd34d; border: 1px solid rgba(251,191,36,0.3); }
    .badge-partial { background: rgba(249,115,22,0.15); color: #fdba74; border: 1px solid rgba(249,115,22,0.3); }

    /* ── Customer row ── */
    .cust-row {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #1e40af, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
      flex-shrink: 0;
    }
    .cust-name { font-weight: 700; font-size: 14px; color: #fff; }
    .cust-sub  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── Progress steps ── */
    .progress-section { padding: 18px 20px; }
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px;
    }
    .step-list { display: flex; flex-direction: column; gap: 0; }
    .step {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 10px 0;
      position: relative;
    }
    .step:not(:last-child)::after {
      content: ''; position: absolute;
      left: 17px; top: 38px; bottom: -4px;
      width: 2px;
      background: var(--border);
    }
    .step.done::after { background: linear-gradient(to bottom, #25d366, rgba(37,211,102,0.2)); }

    .step-icon {
      width: 34px; height: 34px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      border: 2px solid;
      transition: all 0.3s;
      position: relative; z-index: 1;
    }
    .step.done .step-icon  { background: rgba(37,211,102,0.15); border-color: rgba(37,211,102,0.4); }
    .step.skip .step-icon  { background: rgba(255,255,255,0.04); border-color: var(--border); }

    .step-body { flex: 1; padding-top: 4px; }
    .step-label {
      font-size: 13px; font-weight: 600;
      color: #fff;
    }
    .step.skip .step-label { color: var(--muted); }
    .step-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .step-date { font-size: 11px; color: #25d366; margin-top: 2px; font-weight: 600; }

    /* ── Payment row ── */
    .payment-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: var(--border);
      border-top: 1px solid var(--border);
    }
    .pay-cell {
      background: var(--card); padding: 14px 12px; text-align: center;
    }
    .pay-label { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
    .pay-value { font-size: 16px; font-weight: 800; margin-top: 4px; }

    /* ── Notes ── */
    .notes-box {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-start;
    }
    .notes-text { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* ── Footer ── */
    .footer {
      text-align: center; padding: 24px 20px 0;
      font-size: 11px; color: var(--muted); line-height: 1.7;
    }
    .footer strong { color: var(--text); }
    .refresh-btn {
      margin-top: 16px;
      background: rgba(255,255,255,0.06); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 22px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .powered {
      margin-top: 28px; padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 10px; color: #374151;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-ring">💡</div>
    <div class="company-name">HARIOM LED & HD FLEX</div>
    <div class="company-sub">PNB Bank के पास · Gangapur, Bhilwara</div>
  </div>

  <!-- Dynamic content -->
  <div class="container">
    <div id="root"><div class="state-box"><div class="spinner"></div><p style="color:#6b7280;font-size:13px;">ऑर्डर लोड हो रहा है…<br>Loading order status…</p></div></div>
  </div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────────────────────
    const SUPABASE_URL = 'https://znhurvvofdcynypqsiwe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuaHVydnZvZmRjeW55cHFzaXdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MzUyMTUsImV4cCI6MjA5MTMxMTIxNX0.CUJ6O6cg2g7cCXdVj0pVM3SPsRjS2fi6i6tcr-q5Lyo';

    // ─── HELPERS ─────────────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('id');
    const root = document.getElementById('root');

    async function sbFetch(path) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Accept': 'application/json',
        }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function payBadge(status) {
      const map = { Paid: 'badge-paid', Partial: 'badge-partial', Pending: 'badge-pending' };
      return `<span class="badge ${map[status] || 'badge-pending'}">${status === 'Paid' ? '✓ Paid' : status === 'Partial' ? '⚡ Partial' : '⏳ Pending'}</span>`;
    }

    function initial(name) {
      return (name || 'C').charAt(0).toUpperCase();
    }

    function fmtDate(d) {
      if (!d) return '';
      try { return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); }
      catch { return d; }
    }

    // ─── RENDER ──────────────────────────────────────────────────────────────
    async function loadOrder() {
      if (!orderId) {
        root.innerHTML = `<div class="state-box"><p style="font-size:32px;margin-bottom:12px">🔍</p><p style="color:#dc2626;font-weight:700">ऑर्डर ID नहीं मिला</p><p style="color:#6b7280;font-size:12px;margin-top:6px">Invalid or missing order ID in URL.</p></div>`;
        return;
      }

      try {
        const [orders, customers] = await Promise.all([
          sbFetch(`orders?id=eq.${orderId}&select=id,order_no,serial_no,department,customer_id,city,mobile,order_date,design_ok,fit_ok,print_ok,cutting_ok,bond_ok,ok_date,dispatched,dispatch_date,notes,total_amount,advance,due,payment_status,work_date,delivery_mode,board_details`),
          sbFetch(`customers?select=id,name,city`)
        ]);

        if (!orders || orders.length === 0) {
          root.innerHTML = `<div class="state-box"><p style="font-size:32px;margin-bottom:12px">😕</p><p style="color:#f59e0b;font-weight:700">ऑर्डर नहीं मिला | Order Not Found</p><p style="color:#6b7280;font-size:12px;margin-top:6px">Order #${orderId} could not be found. Please check your QR code.</p></div>`;
          return;
        }

        const o = orders[0];
        const cust = customers.find(c => c.id === o.customer_id) || {};
        const isSign = o.department === 'Sign Boards';
        const orderRef = isSign ? (o.serial_no || '-') : (o.order_no || '-');

        // Build steps based on department
        let steps;
        if (isSign) {
          steps = [
            { key: 'order_placed', icon: '📋', label: 'ऑर्डर दर्ज | Order Placed',     sub: 'ऑर्डर रजिस्टर हो गया है | Order registered', done: true, date: o.order_date },
            { key: 'design',       icon: '🎨', label: 'डिज़ाइन | Design',               sub: 'डिज़ाइन तैयार और अप्रूव | Design ready & approved', done: !!o.design_ok },
            { key: 'cutting',      icon: '✂️', label: 'कटिंग | Cutting',               sub: 'साइनबोर्ड कटिंग पूरी | Board cutting complete', done: !!o.cutting_ok },
            { key: 'bond',         icon: '💡', label: 'बोंड/लाइट्स | Bond & Lights',   sub: 'बोंडिंग और लाइट्स इंस्टॉलेशन | Bonding & lights done', done: !!o.bond_ok, date: o.ok_date },
            { key: 'dispatched',   icon: '🚚', label: 'डिस्पैच | Dispatched',           sub: 'ऑर्डर डिस्पैच / पिकअप के लिए तैयार | Ready for pickup', done: !!o.dispatched, date: o.dispatch_date },
          ];
        } else {
          steps = [
            { key: 'order_placed', icon: '📋', label: 'ऑर्डर दर्ज | Order Placed',     sub: 'ऑर्डर रजिस्टर हो गया है | Order registered', done: true, date: o.order_date },
            { key: 'design',       icon: '🎨', label: 'डिज़ाइन | Design',               sub: 'डिज़ाइन तैयार और अप्रूव | Design ready', done: !!o.design_ok },
            { key: 'fit',          icon: '🔧', label: 'फिटिंग | Fitting',               sub: 'नंबर प्लेट फिटिंग पूरी | Plate fitting done', done: !!o.fit_ok },
            { key: 'print',        icon: '🖨️', label: 'प्रिंटिंग | Printing',           sub: 'प्रिंटिंग पूरी | Printing complete', done: !!o.print_ok, date: o.work_date },
            { key: 'dispatched',   icon: '🚚', label: 'डिस्पैच | Dispatched',           sub: 'ऑर्डर डिस्पैच / पिकअप के लिए तैयार | Ready', done: !!o.dispatched, date: o.dispatch_date },
          ];
        }

        const stepsHtml = steps.map((s, i) => {
          const cls = s.done ? 'done' : 'skip';
          return `
            <div class="step ${cls}">
              <div class="step-icon">${s.done ? '✅' : s.icon}</div>
              <div class="step-body">
                <div class="step-label">${s.label}</div>
                <div class="step-sub">${s.sub}</div>
                ${s.date && s.done ? `<div class="step-date">${fmtDate(s.date)}</div>` : ''}
              </div>
            </div>`;
        }).join('');

        const totalFormatted   = (parseFloat(o.total_amount) || 0).toLocaleString('en-IN');
        const advanceFormatted = (parseFloat(o.advance) || 0).toLocaleString('en-IN');
        const dueFormatted     = (parseFloat(o.due) || 0).toLocaleString('en-IN');
        const dueColor         = parseFloat(o.due) > 0 ? '#f87171' : '#86efac';

        root.innerHTML = `
          <div class="order-card">
            <!-- Order header -->
            <div class="order-header">
              <div style="font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">
                ${isSign ? 'Serial Number | सीरियल नंबर' : 'Order Number | ऑर्डर नंबर'}
              </div>
              <div class="order-no">${orderRef}</div>
              <div class="order-meta">
                <span class="badge badge-dept">${o.department || 'Number Plates'}</span>
                ${payBadge(o.payment_status || 'Pending')}
                ${o.dispatched ? '<span class="badge badge-paid">🚚 Dispatched</span>' : ''}
              </div>
            </div>

            <!-- Customer -->
            <div class="cust-row">
              <div class="avatar">${initial(cust.name)}</div>
              <div>
                <div class="cust-name">${cust.name || 'Customer'}</div>
                <div class="cust-sub">${[cust.city || o.city, o.order_date ? 'Order: ' + fmtDate(o.order_date) : ''].filter(Boolean).join(' · ')}</div>
              </div>
            </div>

            <!-- Progress -->
            <div class="progress-section">
              <div class="section-title">ऑर्डर की स्थिति | Order Progress</div>
              <div class="step-list">${stepsHtml}</div>
            </div>

            <!-- Payment -->
            <div class="payment-grid">
              <div class="pay-cell">
                <div class="pay-label">Total | कुल</div>
                <div class="pay-value" style="color:#e5e7eb">₹${totalFormatted}</div>
              </div>
              <div class="pay-cell">
                <div class="pay-label">Advance | अग्रिम</div>
                <div class="pay-value" style="color:#86efac">₹${advanceFormatted}</div>
              </div>
              <div class="pay-cell">
                <div class="pay-label">Due | बकाया</div>
                <div class="pay-value" style="color:${dueColor}">₹${dueFormatted}</div>
              </div>
            </div>

            ${o.notes ? `
            <div class="notes-box">
              <span style="font-size:16px;flex-shrink:0">📝</span>
              <div class="notes-text">${o.notes}</div>
            </div>` : ''}

            ${o.board_details && o.board_details.voiceNote ? `
            <div class="notes-box" style="border-top: 1px solid var(--border); background: rgba(37,211,102,0.02);">
              <span style="font-size:16px;flex-shrink:0">🎙️</span>
              <div style="flex: 1;">
                <div style="font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em;">वॉइस निर्देश | Voice Instructions</div>
                <audio src="${o.board_details.voiceNote}" controls style="width: 100%; height: 32px; outline: none; border-radius: 4px;" />
              </div>
            </div>` : ''}
          </div>

          <div class="footer">
            <strong>HARIOM LED & HD FLEX</strong><br>
            PNB Bank के पास, Gangapur - Bhilwara<br>
            <button class="refresh-btn" onclick="loadOrder()">🔄 Refresh Status</button>
          </div>

          <div class="powered">Powered by Hariom LED ERP · Last updated: ${new Date().toLocaleString('en-IN')}</div>
        `;
      } catch (err) {
        root.innerHTML = `<div class="state-box"><p style="font-size:32px;margin-bottom:12px">⚠️</p><p style="color:#f59e0b;font-weight:700">कुछ गड़बड़ हुई | Something went wrong</p><p style="color:#6b7280;font-size:12px;margin-top:6px">${err.message}</p><button class="refresh-btn" onclick="loadOrder()" style="margin-top:16px">🔄 फिर कोशिश करें | Retry</button></div>`;
      }
    }

    loadOrder();
  </script>
</body>
</html>
